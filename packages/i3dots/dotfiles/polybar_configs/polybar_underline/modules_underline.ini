[module/rofi]
type=custom/text
format=${vars.launcher-icon}
format-font = 5
format-padding = 10px
format-foreground=${vars.rofi-fg}
format-background=${vars.rofi-bg}
click-left= bash ~/.config/rofi/bin/launch.sh
click-right= ${vars.dots-cmd} i3dots powermenu

[module/i3]
type = internal/i3
enable-scroll = false
show-urgent = true
strip-wsnumbers = false
index-sort = true
enable-click = true
fuzzy-match = true

format = <label-state> <label-mode>
label-mode = %mode%
label-mode-padding = 10px
label-mode-background = ${colors.red}
label-mode-foreground = ${colors.white0}

label-focused = " %name% "
label-focused-foreground = ${vars.focused-fg}
label-focused-background= ${vars.focused-bg}
label-focused-underline = ${vars.focused-underline}

label-unfocused = " %name% "
label-unfocused-foreground = ${colors.foreground}
label-unfocused-underline = ${colors.background-alt}

label-visible = " %icon% "
label-visible-underline = ${colors.background-alt}

label-urgent = " %icon% "
label-urgent-foreground = ${colors.white0}
label-urgent-background= ${colors.red}
label-urgent-underline = ${colors.red}

label-separator =
[module/xwindow]
type = internal/xwindow
format-prefix=󰍹
format-prefix-font = 5
format-prefix-padding = 1
format-prefix-foreground=${vars.prefix-fg}
format-prefix-background=${vars.prefix-bg}
format-underline=${colors.green}
label = " %class% "
label-maxlen=60
label-foreground = ${colors.foreground}


[module/time]
type = internal/date
interval = 1
format-prefix = ${vars.icon-date}
format-prefix-font = 5
format-prefix-foreground=${vars.prefix-fg}
format-prefix-background=${vars.prefix-bg}
format-underline=${colors.primary}
date = %A %d %b | %H:%M
label = " %date% "
label-foreground = ${colors.foreground}

[module/filesystem]
type = internal/fs
interval = 2
mount-0 = /
format-mounted-prefix = ${vars.icon-disk}
format-mounted-prefix-font = 5
format-mounted-prefix-foreground = ${vars.prefix-fg}
format-mounted-prefix-background= ${vars.prefix-bg}
format-mounted-underline = ${colors.green}
label-mounted = " %free% "
label-mounted-foreground = ${colors.foreground}

[module/cpu]
type = internal/cpu
interval = 1
format-prefix = ${vars.icon-cpu}
format-prefix-font = 5
format-prefix-foreground = ${vars.prefix-fg}
format-prefix-background= ${vars.prefix-bg}
format-underline = ${colors.green}
label = " %percentage%% "
label-foreground = ${colors.foreground}

[module/temp]
type = internal/temperature
interval = 0.5
hwmon-path = ${env:HWMON_PATH}
base-temperature = 20
warn-temperature = 70
units = true
format = <label>
format-prefix = ${vars.icon-temp}
format-prefix-font = 5
format-prefix-foreground= ${vars.prefix-fg}
format-prefix-background= ${vars.prefix-bg}
format-underline = ${colors.green}
label = " %temperature-c% "
label-foreground = ${colors.foreground}

[module/memory]
type = internal/memory
interval = 1
format-prefix = ${vars.icon-ram}
format-prefix-font = 5
format-prefix-foreground = ${vars.prefix-fg}
format-prefix-background= ${vars.prefix-bg}
format-underline = ${colors.green}
label = " %mb_used% "
label-foreground = ${colors.foreground}

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = ${vars.icon-vol}
format-volume-prefix-font = 5
format-volume-prefix-foreground = ${vars.prefix-fg}
format-volume-prefix-background= ${vars.prefix-bg}
format-volume-underline = ${colors.secondary}
format-volume = <label-volume>
label-volume = " %percentage%% "
label-volume-foreground= ${colors.foreground}

format-muted-prefix = 
format-muted-prefix-font = 2
format-muted-prefix-foreground = ${vars.prefix-fg}
format-muted-background = ${vars.prefix-bg}
label-muted = " muted "
label-muted-foreground = ${colors.orange}

[module/tray]
type=internal/tray
format = <tray>
tray-spacing= 10px
format-padding=8px

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = ${system.sys_battery}
adapter = ${system.sys_adapter}
poll-interval = 5

format-charging = <animation-charging><label-charging>
format-charging-underline = ${colors.green}
label-charging = " %percentage%% "
label-charging-foreground = ${colors.foreground}

format-discharging = <ramp-capacity><label-discharging>
format-discharging-underline = ${colors.green}
label-discharging = " %percentage%% "
label-discharging-foreground = ${colors.foreground}

format-full = <ramp-capacity><label-full>
format-full-underline = ${colors.green}
label-full = " %percentage%% "
label-full-foreground = ${colors.foreground}

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-font = 6
ramp-capacity-foreground = ${vars.prefix-fg}
ramp-capacity-background = ${vars.prefix-bg}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-font = 6
animation-charging-framerate = 750
animation-charging-foreground = ${vars.prefix-fg}
animation-charging-background = ${vars.prefix-bg}

[module/backlight]
type = internal/backlight
card = ${system.sys_graphics_card}
use-actual-brightness = true
enable-scroll = true
format = <label>
format-prefix = ${vars.icon-light}
format-prefix-font = 5
format-prefix-foreground = ${vars.prefix-fg}
format-prefix-background = ${vars.prefix-bg}
format-underline = ${colors.yellow}
label = " %percentage%% "
label-foreground=${colors.foreground}
