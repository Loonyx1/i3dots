;==========================================================
; Importing files 
include-file = ~/.config/polybar/hardware.ini
include-file = ~/.config/polybar/modules.ini
include-file = ~/.config/polybar/colors.ini

;==========================================================
[bar/i3_bar]
width = 100%
height = 15pt
radius = 0
dpi = 100
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2pt
border-size = 3pt
border-color = ${colors.background}
module-margin = 0
padding-left= 4pt
padding-right= 4pt
separator =" "
separator-foreground = ${colors.background}

font-0 = "JetBrainsMono Nerd Font Mono:style=Bold:size=10;4"
font-1 = "JetBrainsMono Nerd Font Mono:size=16;4"
font-2 = "JetBrainsMono Nerd Font Mono:size=10:antialias=false;4"

modules-left = rofi i3 xwindow tray
modules-right = filesystem cpu backlight temp memory pulseaudio battery time 

cursor-click = pointer
enable-ipc = true
wm-restack = i3

[settings]
screenchange-reload = true
pseudo-transparency = true
