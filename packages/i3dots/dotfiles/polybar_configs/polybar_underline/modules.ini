[module/rofi]
type=custom/text
format="󱘊"
format-padding = 10px
format-foreground=${colors.background-solid}
format-background=${colors.primary}
click-left= exec rofi -show drun -disable-history -show-icons
click-right= exec ~/.config/custom_scripts/power.sh

[module/i3]
type = internal/i3
enable-scroll = false
show-urgent = true
strip-wsnumbers = false
index-sort = true
enable-click = true
fuzzy-match = true

format = <label-state> <label-mode>
label-mode = %mode%
label-mode-padding = 10px
label-mode-background = ${colors.red} 
label-mode-foreground = ${colors.white0}

label-focused = " %name% "
label-focused-foreground = ${colors.background-solid}
label-focused-background= ${colors.primary}
label-focused-underline = ${colors.primary}
label-focused-padding = 0

label-unfocused = " %name% "
label-unfocused-foreground = ${colors.foreground}
label-unfocused-underline = ${colors.background-alt}
label-unfocused-padding = 0

label-visible = " %icon% "
label-visible-underline = ${colors.background-alt}
label-visible-padding = 0

label-urgent = " %icon% "
label-urgent-foreground = ${colors.white0}
label-urgent-background= ${colors.red}
label-urgent-underline = ${colors.red}
label-urgent-padding = 0

label-separator = ""

[module/xwindow]
type = internal/xwindow
format-prefix=" 󰣆 "
format-prefix-font = 2
format-prefix-foreground=${colors.background-solid}
format-prefix-background=${colors.green}
format-underline=${colors.green}
label = " %class% "
label-maxlen=60
label-foreground = ${colors.foreground}

[module/time]
type = internal/date
interval = 1
format-prefix = "  "
format-prefix-font = 2
format-prefix-foreground=${colors.background-solid}
format-prefix-background=${colors.primary}
format-underline=${colors.primary}
date = %A %d %b | %H:%M
label = " %date% " 
label-foreground = ${colors.foreground}

[module/filesystem]
type = internal/fs
interval = 2
mount-0 = /
format-mounted-prefix = "  "
format-mounted-prefix-font = 2
format-mounted-prefix-foreground = ${colors.background-solid}
format-mounted-prefix-background= ${colors.green}
format-mounted-underline = ${colors.green}
label-mounted = " %free% "
label-mounted-foreground = ${colors.foreground}

[module/cpu]
type = internal/cpu
interval = 1
format-prefix = "  "
format-prefix-font = 2
format-prefix-foreground = ${colors.background-solid}
format-prefix-background= ${colors.green}
format-underline = ${colors.green}
label = " %percentage%% "
label-foreground = ${colors.foreground}

[module/temp]
type = internal/temperature
interval = 0.5
hwmon-path = ${env:HWMON_PATH}
base-temperature = 20 
warn-temperature = 70
units = true
format = <label>
format-prefix = " 󰴈 "
format-prefix-font = 2
format-prefix-foreground= ${colors.background-solid}
format-prefix-background= ${colors.green}
format-underline = ${colors.green}
label = " %temperature-c% "
label-foreground = ${colors.foreground}

[module/memory]
type = internal/memory
interval = 1 
format-prefix = "  "
format-prefix-font = 2
format-prefix-foreground = ${colors.background-solid}
format-prefix-background= ${colors.green}
format-underline = ${colors.green}
label = " %mb_used% "
label-foreground = ${colors.foreground}

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "  "
format-volume-prefix-font = 2
format-volume-prefix-foreground = ${colors.background-solid}
format-volume-prefix-background= ${colors.secondary}
format-volume-underline = ${colors.secondary}
format-volume = <label-volume>
label-volume = " %percentage%% "
label-volume-foreground= ${colors.foreground}

format-muted-prefix = "  "
format-muted-prefix-font = 2
format-muted-prefix-foreground = ${colors.background-solid}
format-muted-background = ${colors.orange}
label-muted = " muted "
label-muted-foreground = ${colors.orange}

[module/tray]
type=internal/tray
format = <tray>
tray-spacing= 10px
format-padding=8px

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = ${system.sys_battery}
adapter = ${system.sys_adapter}
poll-interval = 5

format-charging = <animation-charging><label-charging>
format-charging-underline = ${colors.green}
label-charging = " %percentage%% "
label-charging-foreground = ${colors.foreground}

format-discharging = <ramp-capacity><label-discharging>
format-discharging-underline = ${colors.green}
label-discharging = " %percentage%% "
label-discharging-foreground = ${colors.foreground}

format-full-prefix = "  "
format-full-prefix-font = 2
format-full-prefix-foreground = ${colors.background-solid}
format-full-prefix-background = ${colors.green}
format-full-underline = ${colors.green}
label-full = " %percentage%% "
label-full-foreground = ${colors.foreground}

ramp-capacity-0 = "  "
ramp-capacity-1 = "  "
ramp-capacity-2 = "  "
ramp-capacity-3 = "  "
ramp-capacity-4 = "  "
ramp-capacity-font = 2
ramp-capacity-foreground = ${colors.background-solid}
ramp-capacity-background = ${colors.green}

animation-charging-0 = "  "
animation-charging-1 = "  "
animation-charging-2 = "  "
animation-charging-3 = "  "
animation-charging-4 = "  "
animation-charging-font = 2
animation-charging-framerate = 750
animation-charging-foreground = ${colors.background-solid}
animation-charging-background = ${colors.green}

[module/backlight]
type = internal/backlight
card = ${system.sys_graphics_card}
use-actual-brightness = true
enable-scroll = true
format = <label>
format-prefix = " 󰞏 "
format-prefix-font = 2
format-prefix-foreground = ${colors.background-solid}
format-prefix-background = ${colors.yellow}
format-underline = ${colors.yellow}
label = " %percentage%% "
label-foreground=${colors.foreground}
