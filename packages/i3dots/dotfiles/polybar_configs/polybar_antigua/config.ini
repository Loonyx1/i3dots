[global/wm]
include-file = cpu.ini
include-file = utils.ini
include-file = system.ini

[vars-local]
; Sincronizado con estilo moderno
icon-cpu = "  "
icon-ram = "  "
icon-temp = " 󰴈 "
icon-vol = "  "
icon-bat = "  "
icon-date = "  "
icon-disk = "  "
icon-light = " 󰞏 "
launcher-icon = " 󰣆 "

[bar-base]
type = bar
width = 100%
height = ${vars.height}
radius = ${vars.radius}
bottom = ${vars.bottom}
dpi = 96
background = ${vars.background}
foreground = ${colors.foreground}
line-size = 2pt
border-size = 3pt
border-color = ${vars.background}
padding-left = 0
padding-right = 0
module-margin = 0
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
override-redirect = false

; Fonts Locales (Estilo Clásico)
font-0 = "JetBrainsMono Nerd Font:pixelsize=10;2"
font-1 = "JetBrainsMono Nerd Font:pixelsize=14;3"
font-2 = "JetBrainsMono Nerd Font:pixelsize=11:antialias=false;3"
font-3 = "JetBrainsMono Nerd Font:pixelsize=14;2"
font-4 = ${vars.font-extra}
font-5 = ${vars.font-rofi}
font-6 = "JetBrainsMono Nerd Font:pixelsize=12;3"
font-7 = "Symbols Nerd Font Mono:pixelsize=12;2"
font-8 = "JetBrainsMono Nerd Font:pixelsize=18;4"




[bar/bottom]
;monitor = eDP-1
inherit = bar-base
bottom = ${vars.bottom}
modules-left = ${env:POLY_LEFT}
modules-center= ${env:POLY_CENTER}
modules-right = ${env:POLY_RIGHT}



[module/i3-workspaces]
; General.
type = internal/i3
index-sort = true
pin-workspaces = true
; Focused.
label-focused = %name%
label-focused-underline= ${colors.primary}
label-focused-background = ${colors.background-alt}
label-focused-foreground = ${colors.foreground}
label-focused-padding = 1
; Visible.
label-visible = %name%
label-visible-padding = 1
label-visible-background = ${colors.background-alt}
label-visible-foreground = ${colors.foreground}
; Urgent.
label-urgent = %name%
label-urgent-padding = 1
label-urgent-background = ${colors.primary}
label-urgent-foreground = ${colors.background-alt}
; Empty.
label-unfocused = "%name%"
label-unfocused-padding = 1
label-unfocused-foreground = ${colors.primary}
label-unfocused-background= ${colors.background-alt}


[settings]
screenchange-reload = true
pseudo-transparency = true

