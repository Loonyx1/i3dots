backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;

xrender-sync-fence = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

shadow = false;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

animations = (
  {
    triggers = ["open", "show"];
    preset = "appear";
    scale = 0.9;
    duration = 0.15;
  },
  {
    triggers = ["close", "hide"];
    preset = "disappear";
    scale = 0.9;
    duration = 0.12;
  }
);

corner-radius = 0;
blur-background = false;
blur-background-frame = false;

log-level = "warn";
