backend = "xrender";
vsync = true;
use-damage = true;
unredir-if-possible = true;

# Las animaciones se definen en window rules para poder excluir ventanas especificas.
# La lista global animations = () esta vacia; las animaciones viven en las reglas.
animations = ();

rules = (
  # mpv embebido en xwinwrap: sin animaciones, sin fade, sin sombra
  {
    match = "class_i = 'mpv-wallpaper'";
    animations = ();
    fade = false;
    shadow = false;
  },
  # Xwinwrap (override_redirect): sin animaciones, sin fade, sin sombra
  {
    match = "override_redirect = true";
    animations = ();
    fade = false;
    shadow = false;
  },
  # Todas las demas ventanas reciben la animacion de apertura/cierre
  {
    match = "class_i != 'mpv-wallpaper' && override_redirect = false";
    animations = (
      {
        triggers = ["open", "show"];
        preset = "appear";
        scale = 0.95;
        duration = 0.15;
      },
      {
        triggers = ["close", "hide"];
        preset = "disappear";
        scale = 0.95;
        duration = 0.12;
      }
    );
  }
);
