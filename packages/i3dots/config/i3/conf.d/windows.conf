# Utilice Mouse+$mod para arrastrar ventanas flotantes a la posición deseada
floating_modifier $mod

# mover ventanas en mosaico mediante arrastrar y soltar haciendo clic izquierdo en la barra de título, o haciendo clic izquierdo en cualquier lugar de la ventana mientras mantiene presionado el modificador flotante.
#tiling_drag modifier titlebar

for_window [class=".*"] border pixel 2
# for_window [class="kitty"] floating enable, resize set 800 500, move position center
#for_window [class="Pcmanfm"] floating enable 
for_window [title="i3-cheatsheet"] floating enable, border pixel 3, move position center

# mpv embebido en xwinwrap (instance = mpv-wallpaper por --x11-name)
# Solo quitar borde para evitar que picom aplique animacion en el borde decorado por i3
for_window [instance="mpv-wallpaper"] floating enable, border none
for_window [instance="xwinwrap"] floating enable, border none



