# El entorno I3
exec --no-startup-id dex --autostart --environment i3
exec --no-startup-id xsettingsd
exec_always ~/.config/polybar/launch.sh
exec_always setxkbmap latam
exec_always --no-startup-id $polkit_agent &
# exec_always --no-startup-id pipewire
exec_always --no-startup-id picom -f
exec --no-startup-id sh -c 'feh --bg-fill "$(cat ~/.config/i3/wall)"'
exec --no-startup-id ~/.local/bin/recolor_folders --restore


