;==========================================================
; Importing files - MUST BE AT THE TOP
include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/variables.ini
include-file = modules.ini

;==========================================================
[bar/main]
width = 100%
height = ${vars.height}
radius = ${vars.radius}
bottom = ${vars.bottom}
dpi = 100
background = ${vars.background}
foreground = ${colors.foreground}
border-left-size = 180
border-right-size = 180
border-top-size = 5
border-bottom-size = 5
border-color = #00000000

; Margen 0 para que no interfiera con el margen dinámico de los módulos
module-margin = 0

padding-left= 4pt
padding-right= 4pt
separator =

font-0 = ${vars.font-0}
font-1 = ${vars.font-1}
font-2 = ${vars.font-2}
font-3 = ${vars.font-rofi}
font-4 = ${vars.font-symbols}
font-5 = ${vars.font-large}

; Listas limpias sin espaciadores manuales, agrupados con módulo space
modules-left = rofi space xwindow space filesystem filesystem-value space cpu cpu-value space memory memory-value space temp temp-value
modules-center = i3
modules-right = backlight backlight-value space pulseaudio pulseaudio-value space battery battery-value space time time-value space tray

cursor-click = pointer
enable-ipc = true
wm-restack = i3
