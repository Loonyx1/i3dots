[module/rofi]
type=custom/text
format=${vars.launcher-icon-raw}
format-font = 5
format-padding = ${vars.icon-padding}
format-foreground=${colors.background-solid}
format-background=${colors.primary}
click-left= bash ~/.config/rofi/bin/launch.sh
click-right= ${vars.dots-cmd} ${vars.current-env} powermenu

[module/ss]
type=custom/text
format= 
format-background=${colors.background}

[module/i3]
type = internal/i3
enable-scroll = false
show-urgent = true
strip-wsnumbers = false
index-sort = true
enable-click = true
fuzzy-match = true

format = <label-state> <label-mode>
label-mode = %mode%
label-mode-padding = 4px
label-mode-background = ${colors.red} 
label-mode-foreground = ${colors.white0}

label-focused = %name%
label-focused-foreground = ${colors.background-solid}
label-focused-background= ${colors.primary}
label-focused-padding = 12px

label-unfocused = %name%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-background= ${colors.background-alt}
label-unfocused-padding = 8px

label-visible = %name%
label-visible-background = ${colors.background-alt}
label-visible-padding = 8px

label-urgent = %name%
label-urgent-foreground = ${colors.background-solid}
label-urgent-background= ${colors.red}
label-urgent-padding = 8px

label-separator = %{O2px}
label-separator-background = ${vars.background}

[module/xwindow]
type = internal/xwindow
format-prefix = 󰍹
format-prefix-font = 5
format-prefix-padding = ${vars.icon-padding}
format-prefix-foreground = ${colors.background-solid}
format-prefix-background = ${colors.green}
label = %class%
label-padding = 4px
label-maxlen = 60
label-foreground = ${colors.foreground}
label-background = ${colors.background-solid}
label-empty = " Escritorio "
label-empty-padding = 4px
label-empty-foreground = ${colors.foreground-alt}
label-empty-background = ${colors.background-solid}

[module/time]
type = custom/text
format = ${vars.icon-date}
format-font = 5
format-padding = ${vars.icon-padding}
format-foreground = ${colors.background-solid}
format-background = ${colors.primary}
click-left = #time-value.module_toggle

[module/time-value]
hidden = true
type = internal/date
interval = 1
date = %H:%M
date-alt = %A %d %b | %H:%M
label = %date% 
label-padding = 4px
label-foreground = ${colors.foreground}
label-background = ${colors.background-solid}

[module/space]
type = custom/text
format = "  "

[module/filesystem]
type = custom/text
format = ${vars.icon-disk}
format-font = 5
format-padding = ${vars.icon-padding}
format-foreground = ${colors.background-solid}
format-background = ${colors.green}
click-left = #filesystem-value.module_toggle

[module/filesystem-value]
hidden = true
type = internal/fs
interval = 2
mount-0 = /
format-mounted = <label-mounted>
label-mounted = %free%
label-mounted-padding = 4px
label-mounted-foreground = ${colors.foreground}
label-mounted-background = ${colors.background-solid}

[module/cpu]
type = custom/text
format = ${vars.icon-cpu}
format-font = 5
format-padding = ${vars.icon-padding}
format-foreground = ${colors.background-solid}
format-background = ${colors.green}
click-left = #cpu-value.module_toggle

[module/cpu-value]
hidden = true
type = internal/cpu
interval = 1
format = <label>
label = %percentage%%
label-padding = 4px
label-foreground = ${colors.foreground}
label-background = ${colors.background-solid}

[module/temp]
type = custom/text
format = ${vars.icon-temp}
format-font = 5
format-padding = ${vars.icon-padding}
format-foreground = ${colors.background-solid}
format-background = ${colors.green}
click-left = #temp-value.module_toggle

[module/temp-value]
hidden = true
type = internal/temperature
interval = 0.5
hwmon-path = ${env:HWMON_PATH}
base-temperature = 20 
warn-temperature = 70
units = true
format = <label>
label = %temperature-c%
label-padding = 4px
label-foreground = ${colors.foreground}
label-background = ${colors.background-solid}
format-warn = <label-warn>
label-warn = %temperature-c%
label-warn-padding = 4px
label-warn-foreground = ${colors.foreground}
label-warn-background = ${colors.background-solid}

[module/memory]
type = custom/text
format = ${vars.icon-ram}
format-font = 5
format-padding = ${vars.icon-padding}
format-foreground = ${colors.background-solid}
format-background = ${colors.green}
click-left = #memory-value.module_toggle

[module/memory-value]
hidden = true
type = internal/memory
interval = 1 
format = <label>
label = %mb_used%
label-padding = 4px
label-foreground = ${colors.foreground}
label-background = ${colors.background-solid}

[module/pulseaudio]
type = custom/text
format = ${vars.icon-vol}
format-font = 5
format-padding = ${vars.icon-padding}
format-foreground = ${colors.background-solid}
format-background = ${colors.green}
click-left = #pulseaudio-value.module_toggle
click-right = pactl set-sink-mute @DEFAULT_SINK@ toggle
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

[module/pulseaudio-value]
hidden = true
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = %percentage%%
label-volume-padding = 4px
label-volume-foreground = ${colors.foreground}
label-volume-background = ${colors.background-solid}
format-muted = <label-muted>
label-muted = muted
label-muted-padding = 4px
label-muted-foreground = ${colors.orange}
label-muted-background = ${colors.background-solid}

[module/tray]
type=internal/tray
format = <tray>
tray-size = 70%
tray-spacing= 10px
format-padding = 8px
format-background=${colors.background-solid}
tray-background = ${colors.background-solid}

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = ${env:BAR_BATTERY:BAT0}
adapter = ${env:BAR_ADAPTER:AC}
poll-interval = 5

format-charging = %{A1:#battery-value.module_toggle:}<animation-charging>%{A}
format-discharging = %{A1:#battery-value.module_toggle:}<ramp-capacity>%{A}

format-full = %{A1:#battery-value.module_toggle:}<label-full>%{A}
label-full = 
label-full-font = 5
label-full-padding = ${vars.icon-padding}
label-full-foreground = ${colors.background-solid}
label-full-background = ${colors.green}

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-font = 5
ramp-capacity-padding = ${vars.icon-padding}
ramp-capacity-foreground = ${colors.background-solid}
ramp-capacity-background = ${colors.green}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-font = 5
animation-charging-padding = ${vars.icon-padding}
animation-charging-framerate = 750
animation-charging-foreground = ${colors.background-solid}
animation-charging-background = ${colors.green}

[module/battery-value]
hidden = true
type = internal/battery
full-at = 99
low-at = 15
battery = ${env:BAR_BATTERY:BAT0}
adapter = ${env:BAR_ADAPTER:AC}
poll-interval = 5

format-charging = <label-charging>
label-charging = %percentage%%
label-charging-padding = 4px
label-charging-foreground = ${colors.foreground}
label-charging-background = ${colors.background-solid}

format-discharging = <label-discharging>
label-discharging = %percentage%%
label-discharging-padding = 4px
label-discharging-foreground = ${colors.foreground}
label-discharging-background = ${colors.background-solid}

format-full = <label-full>
label-full = %percentage%%
label-full-padding = 4px
label-full-foreground = ${colors.foreground}
label-full-background = ${colors.background-solid}

[module/backlight]
type = custom/text
format = ${vars.icon-light}
format-font = 5
format-padding = ${vars.icon-padding}
format-foreground = ${colors.background-solid}
format-background = ${colors.green}
click-left = #backlight-value.module_toggle
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-

[module/backlight-value]
hidden = true
type = internal/backlight
card = ${env:BACKLIGHT_CARD:intel_backlight}
use-actual-brightness = true
format = <label>
label = %percentage%%
label-padding = 4px
label-foreground = ${colors.foreground}
label-background = ${colors.background-solid}


[module/help-keys]
type = custom/text
format = "  Atajos "
format-foreground = ${colors.foreground}
format-background = ${colors.background-solid}
click-left = ${vars.dots-cmd} ${vars.current-env} show_cheatsheet.sh

[settings]
screenchange-reload = false
pseudo-transparency = true

